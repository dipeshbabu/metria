# Copy into .github/workflows/ in a checkout containing the current Metria source.
# Prepare .metria/change.json and its qualified runtime/model before verification.
name: Verify inference change
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install this Metria revision
        run: python -m pip install .
      - name: Verify inference change
        run: metria verify .metria/change.json --output metria-verification --json
      - name: Summarize verification
        if: always()
        run: python tools/ci/write_verification_summary.py metria-verification
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metria-verification
          path: metria-verification/
          if-no-files-found: warn
          retention-days: 14

name: Metria core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: windows-2025
            python-version: "3.13"
          - os: macos-15
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          prune-cache: true

      - name: Sync workspace
        run: uv sync --locked --all-packages

      - name: Run Metria core tests
        run: >-
          uv run --locked pytest metria_tests -v --tb=short
          --cov=metria --cov-report=json:core-coverage.json --cov-fail-under=0
          --skip-report=core-skips.json

      - name: Enforce per-module core coverage
        run: >-
          uv run --locked python tools/maintenance/check_coverage_gates.py
          core-coverage.json --scope core --summary core-coverage.md

      - name: Retain core coverage and skip evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            core-coverage.json
            core-coverage.md
            core-skips.json
          if-no-files-found: warn

      - name: Check Metria types
        run: uv run --locked mypy src/metria

      - name: Check Metria formatting and lint
        run: |
          uv run --locked ruff check src/metria metria_tests
          uv run --locked ruff format --check src/metria metria_tests

site_name: Metria
site_description: Verify an LLM inference change with reproducible evidence and explicit acceptance criteria.
site_url: https://dipeshbabu.github.io/metria/
repo_url: https://github.com/dipeshbabu/metria
repo_name: dipeshbabu/metria
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Dipesh Tharu Mahato
site_dir: site

theme:
  name: material
  language: en
  logo: assets/metria-symbol.svg
  favicon: assets/metria-symbol.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/info-24
      tip: octicons/light-bulb-24
      warning: octicons/alert-24
      danger: octicons/zap-24
      example: octicons/beaker-24
      success: octicons/check-circle-24
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search

hooks:
  - tools/docs/hooks.py

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap
  - assets/stylesheets/metria.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dipeshbabu/metria
      name: Metria on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/metria/
      name: Metria on PyPI


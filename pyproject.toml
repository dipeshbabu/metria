# Root Metria framework and repository-level tool configuration.
#
# Metria owns the fidelity implementation and public release lifecycle.

[project]
name = "metria"
version = "0.1.2"
description = "Verify reference-vs-candidate LLM inference changes with reproducible evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Dipesh Tharu Mahato (dipeshbabu)" },
]
keywords = [
    "llm",
    "inference",
    "benchmarking",
    "evaluation",
    "reproducibility",
    "systems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mlx = [
    "filelock>=4.2.1",
    "mlx>=0.29.4; sys_platform == 'darwin'",
    "mlx-lm>=0.31; sys_platform == 'darwin'",
]
sglang = [
    "filelock>=4.2.1",
    "requests>=2.33",
    "transformers>=5.3",
]
full = [
    "filelock>=4.2.1",
    "mlx>=0.29.4; sys_platform == 'darwin'",
    "mlx-lm>=0.31; sys_platform == 'darwin'",
    "requests>=2.33",
    "transformers>=5.3",
]
research = [
    "numpy>=1.23",
    "scipy>=1.10",
]
benchmarks = [
    "filelock>=4.2.1",
    "numpy>=1.23",
    "scipy>=1.10",
    "torch>=2.13",
    "transformers>=5.3",
]
dev = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "coverage>=7.15.3",
    "build>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/dipeshbabu/metria"
Repository = "https://github.com/dipeshbabu/metria"
Issues = "https://github.com/dipeshbabu/metria/issues"
Documentation = "https://github.com/dipeshbabu/metria/blob/main/docs/guides/metria-verify.md"
Changelog = "https://github.com/dipeshbabu/metria/blob/main/CHANGELOG.md"

[project.scripts]
metria = "metria.cli:main"

[dependency-groups]
# Grouped maintenance-tool bumps are reviewed together with the workspace lockfile.
dev = [
    "build>=1.0",
    "coverage>=7.15.3",
    "mypy==2.4.1",
    "pre-commit>=4.6.1",
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "ruff>=0.16.1",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=7.0.0",
    "types-requests>=2.28",
]

[tool.uv]
required-version = ">=0.11.8"
# Native backend and maintenance dependencies require patched filelock on 3.11+.
# The stdlib-only core retains separate locked Python 3.10 compatibility checks.
environments = ["python_version >= '3.11'"]
constraint-dependencies = [
    # GHSA-rrmf-rvhw-rf47 is fixed in PyTorch 2.13.0.
    "torch>=2.13",
    # Filelock's local lock-path vulnerabilities are fixed in 4.2.1.
    "filelock>=4.2.1",
    # GHSA-xmj3-9gf7-h52w is fixed in setuptools 84.1.0.
    "setuptools>=84.1.0",
]

[tool.uv.workspace]
members = [
    "components/kv-fidelity",
    "components/turboquant-reference",
]

[tool.uv.sources]
metria = { workspace = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
metria = ["data/*.json", "data/*.jsonl"]
"metria.fidelity" = ["prompts/*.jsonl", "prompts/*.md", "examples/*.json", "examples/*.html", "examples/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["metria*"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = [
    "src",
    "components/kv-fidelity/src",
    "components/turboquant-reference/src",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # Line wrapping is delegated to the formatter.
    "E501",
    # Keep Optional[T] stable for runtime annotation consumers.
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Package initializers may intentionally expose imports as public API.
"**/__init__.py" = ["F401"]

[tool.ruff.format]
# Keep code-fence formatting out of retained research and manually edited guides.
exclude = ["*.md"]

[tool.mypy]
mypy_path = [
    "src",
    "components/kv-fidelity/src",
    "components/turboquant-reference/src",
]
files = [
    "src/metria",
    "components/kv-fidelity/src/kv_fidelity",
    "components/turboquant-reference/src/turboquant",
    "tools",
]
python_version = "3.10"
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = false
incremental = false
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional engine stacks are intentionally absent from the default workspace.
module = [
    "cffconvert",
    "cffconvert.*",
    "mlx",
    "mlx.*",
    "mlx_lm",
    "mlx_lm.*",
    "scipy",
    "scipy.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "vllm",
    "vllm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "metria_tests",
    "components/turboquant-reference/tests",
    "components/kv-fidelity/tests",
]
pythonpath = [
    "src",
    "components/turboquant-reference/src",
    "components/kv-fidelity/src",
]
markers = [
    "integration: requires external engines, models, or corpora",
]

[tool.coverage.run]
branch = true
source = ["turboquant", "metria.fidelity"]

[tool.coverage.report]
# The authoritative Ubuntu coverage job currently reports about 86.5% branch
# coverage, including platform-specific backend modules. Keep that baseline
# from regressing while reporting the gate at the same precision.
fail_under = 86
precision = 2
show_missing = true
skip_covered = true

[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"
